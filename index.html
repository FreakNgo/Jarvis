<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<style>
:root{--font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--c:#35d0ff;--c2:#7a5cff;--danger:#e5384f;--onc:#04121c}
:root,[data-theme=light]{--bg:#f2f6ff;--panel:#ffffff;--panel2:#eef2fb;--line:#dce5f5;--text:#0f1a33;--mute:#5d6f90;--glass:rgba(255,255,255,.74);--shadow:0 1px 2px rgba(20,40,90,.06),0 10px 30px rgba(20,40,90,.09);--blob:.42;color-scheme:light}
[data-theme=dark]{--bg:#060a12;--panel:#0d1424;--panel2:#131d33;--line:#1c2a47;--text:#e8f1ff;--mute:#8091ad;--glass:rgba(13,20,36,.74);--shadow:0 1px 2px #0006,0 10px 30px #0008;--blob:.26;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{background:var(--bg)}
body{--pc:#35d0ff;--c:var(--pc);font:15px/1.55 var(--font);color:var(--text);display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0);position:relative;-webkit-font-smoothing:antialiased}
body[data-state=listening]{--c:#19c98a;--d:1.2s}
body[data-state=thinking]{--c:#8b6cff;--d:.9s}
body[data-state=speaking]{--c:var(--pc);--d:.6s}

.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--blob);background:var(--c);transition:background .9s;animation:drift 22s ease-in-out infinite alternate}
.bg i:first-child{width:540px;height:540px;left:-140px;top:-180px}
.bg i:last-child{width:480px;height:480px;right:-150px;bottom:-140px;background:var(--c2);animation-duration:29s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(90px,70px) scale(1.18)}}

header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px}
.brand{font-weight:700;letter-spacing:.24em;font-size:14px}
.brand small{display:block;font-weight:500;letter-spacing:.02em;color:var(--mute);font-size:12px;margin-top:2px}
.hr{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid var(--line);border-radius:99px;background:var(--glass);backdrop-filter:blur(12px);font-size:13px;font-weight:500;color:var(--mute);box-shadow:var(--shadow)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 55%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}
.ib{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);color:var(--text);border-radius:12px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .2s,transform .15s}
.ib:hover{border-color:var(--c);transform:translateY(-1px)}
.ib .sun{display:none}
[data-theme=dark] .ib .sun{display:block}
[data-theme=dark] .ib .moon{display:none}
:focus-visible{outline:2px solid var(--c);outline-offset:3px}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.stage{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0 8px}
.orb{--size:min(230px,52vw);position:relative;width:var(--size);height:var(--size);border:0;background:none;padding:0;border-radius:50%;cursor:pointer;color:inherit}
.orb i{position:absolute;border-radius:50%;pointer-events:none}
.orb .core{inset:23%;background:radial-gradient(circle at 34% 28%,#fff,color-mix(in srgb,var(--c) 62%,#fff) 24%,var(--c) 60%,color-mix(in srgb,var(--c) 60%,#1b2a70) 100%);
  box-shadow:0 20px 60px color-mix(in srgb,var(--c) 55%,transparent),inset 0 -10px 24px #0b1f5a33,inset 0 6px 14px #fffa;animation:breathe var(--d,4.2s) ease-in-out infinite;scale:calc(1 + var(--lv,0)*.32)}
.orb .r1{inset:0;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-top-color:transparent;animation:spin 16s linear infinite}
.orb .r2{inset:10%;border:2px solid transparent;border-top-color:var(--c);border-bottom-color:var(--c2);opacity:.9;animation:spin 7s linear infinite reverse}
.orb .r3{inset:-9%;border:1px dashed color-mix(in srgb,var(--c) 38%,transparent);animation:spin 46s linear infinite}
body[data-state=thinking] .orb .r2{animation-duration:1.3s}
body[data-state=listening] .orb .r1{animation-duration:6s}
@keyframes breathe{50%{transform:scale(1.09)}}
@keyframes spin{to{transform:rotate(360deg)}}
#wave{display:flex;align-items:center;justify-content:center;gap:3px;height:46px;margin-top:6px}
#wave i{width:3px;border-radius:3px;background:linear-gradient(var(--c),var(--c2));height:calc(4px + var(--lv,0)*70px*var(--k,.5));transition:height .08s linear}
#hint{font-size:13px;font-weight:500;color:var(--mute)}
#cap{min-height:22px;max-width:600px;text-align:center;padding:0 8px}

#log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px 2px;scroll-behavior:smooth;mask-image:linear-gradient(transparent,#000 14px)}
#empty{margin:auto;text-align:center;color:var(--mute);max-width:470px}
#empty h2{color:var(--text);font-size:21px;font-weight:700;margin-bottom:4px}
.sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.sug button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 14px;border-radius:99px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.sug button:hover{transform:translateY(-2px);border-color:var(--c)}
.msg{max-width:84%;padding:11px 15px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);box-shadow:var(--shadow);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.msg.user{align-self:flex-end;background:color-mix(in srgb,var(--c) 15%,var(--panel));border-color:color-mix(in srgb,var(--c) 38%,var(--line));border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--panel);border-bottom-left-radius:6px}
.msg.err{align-self:center;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:var(--panel);font-size:13px}
.msg a{color:color-mix(in srgb,var(--c) 60%,#000)}
.ti{display:block;max-width:180px;border-radius:10px;margin-bottom:6px}

#att{display:none;gap:8px;flex-wrap:wrap;padding-top:8px}
#att.on{display:flex}
#att .th{position:relative}
#att img{height:56px;border-radius:10px;border:1px solid var(--line);display:block}
#att button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;line-height:1;padding:0}

form.bar{display:flex;gap:8px;padding:10px;margin:10px 0 16px;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
form.bar input{flex:1;min-width:0;padding:12px 16px;border-radius:14px;border:1px solid transparent;background:var(--panel2);color:var(--text);font:inherit}
form.bar input::placeholder{color:var(--mute)}
form.bar input:focus{outline:none;border-color:var(--c);background:var(--panel)}
.btn{height:46px;min-width:46px;padding:0 13px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font:inherit;font-weight:500;transition:border-color .2s,transform .15s}
.btn:hover{border-color:var(--c);transform:translateY(-1px)}
#mic.on,.btn.on{background:var(--c);color:var(--onc);border-color:var(--c)}
.btn.pri{background:linear-gradient(135deg,var(--c),var(--c2));border:0;color:var(--onc)}
#pv{display:none;position:fixed;right:14px;bottom:110px;width:160px;max-height:120px;object-fit:cover;border-radius:14px;border:2px solid var(--c);background:#000;box-shadow:var(--shadow);z-index:5}

dialog{margin:auto;width:min(460px,calc(100vw - 32px));padding:24px;border-radius:22px;border:1px solid var(--line);background:var(--panel);color:var(--text);box-shadow:0 30px 80px rgba(10,20,50,.28);max-height:calc(100dvh - 32px);overflow:auto}
dialog::backdrop{background:rgba(15,26,51,.38);backdrop-filter:blur(5px)}
dialog h2{font-size:18px;font-weight:700;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:500;color:var(--mute);margin:14px 0 6px}
dialog input[type=password],dialog input[type=text],dialog select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}
dialog input[type=range]{width:100%;accent-color:var(--c)}
dialog a{color:color-mix(in srgb,var(--c) 60%,#000)}
.chk{display:flex;align-items:center;gap:8px;color:var(--text);margin:14px 0 0;cursor:pointer}
.chk input{accent-color:var(--c);width:16px;height:16px}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:20px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;box-shadow:var(--shadow);z-index:20}
#toast.show{opacity:1;transform:translateX(-50%)}
.msg .callbtn{display:inline-block;padding:9px 15px;border-radius:12px;background:var(--c);color:var(--onc);font-weight:600;text-decoration:none}
.hint{font-size:12px;color:var(--mute);margin-top:8px}
.crow{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:6px;font-size:14px}
.crow b{flex:1;font-weight:600;overflow-wrap:anywhere}
.crow span{color:var(--mute);font-size:13px}
.crow a{font-size:13px;font-weight:600}
.crow button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;line-height:1;padding:0}
.cadd{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
.dchip{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);font-size:13px;max-width:100%}
.dchip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;font-weight:600}
.dchip span{color:var(--mute);white-space:nowrap}
#att .dchip button{position:static;width:20px;height:20px}
.cadd .btn{height:auto}
@media (max-width:520px){.cadd{grid-template-columns:1fr 1fr}.cadd .btn{grid-column:1/-1;height:40px}}
@media (max-width:520px){.msg{max-width:92%}.stage{padding-top:8px}form.bar{flex-wrap:wrap}form.bar .btn{order:1;flex:1 0 auto}form.bar #txt{order:2;flex:1 1 60%}form.bar .btn.pri{order:3;flex:0 0 48px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-state="idle">
<div class="bg" aria-hidden="true"><i></i><i></i></div>
<header>
  <div class="brand"><span id="bn">J.A.R.V.I.S.</span><small>Voice assistant on Groq</small></div>
  <div class="hr">
    <div class="chip"><i></i><span id="st">Standby</span></div>
    <button class="ib" id="theme" title="Switch theme" aria-label="Switch theme"><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="ib" id="clear" title="Clear conversation" aria-label="Clear conversation"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
    <button class="ib" id="cfg" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<section class="stage">
  <button class="orb" id="orb" aria-label="Talk to Jarvis"><i class="r3"></i><i class="r1"></i><i class="r2"></i><i class="core"></i></button>
  <div id="wave" aria-hidden="true"></div>
  <div id="hint">Tap the core to talk</div>
  <div id="cap" aria-live="polite"></div>
</section>

<main id="log"><div id="empty"><h2>How can I help?</h2><p>Tap the core and start talking, or try one of these.</p><div class="sug">
    <button type="button" data-q="What is the weather today?">Weather today</button>
    <button type="button" data-q="Latest news headlines">Latest news</button>
    <button type="button" data-q="Set a timer for 5 minutes">Set a timer</button>
    <button type="button" data-q="Take a note that I need to call my doctor">Take a note</button>
    <button type="button" data-q="Play relaxing music on YouTube">Play music</button>
    <button type="button" data-q="Good morning">Daily briefing</button>
    <button type="button" data-q="Tell me a joke">Tell me a joke</button></div></div></main>

<div id="att"></div>
<form class="bar" id="form" autocomplete="off">
  <button type="button" class="btn" id="mic" title="Toggle voice conversation (Space)" aria-label="Toggle voice conversation"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button type="button" class="btn" id="cam" title="Camera vision" aria-label="Camera vision"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  <button type="button" class="btn" id="scr" title="Share screen" aria-label="Share screen"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
  <button type="button" class="btn" id="img" title="Attach image or document (PDF, TXT)" aria-label="Attach image or document"><svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7-7l9-9a3.3 3.3 0 0 1 4.7 4.7l-9 9a1.7 1.7 0 0 1-2.4-2.4l8.3-8.3"/></svg></button>
  <button type="button" class="btn" id="pop" title="Floating ask bar over your screen" aria-label="Floating ask bar"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
  <input type="file" id="fi" accept="image/*,.pdf,.txt,.md,.csv,.json,.log,.xml,.html,application/pdf,text/*" multiple hidden>
  <input id="txt" placeholder="Message" aria-label="Message">
  <video id="pv" muted playsinline></video>
  <button class="btn pri" type="submit" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</form>

<dialog id="dlg">
  <h2>Settings</h2>
  <label for="persona">Personality</label>
  <select id="persona"></select>
  <label for="key">Groq API key</label>
  <input type="password" id="key" placeholder="gsk_..." autocomplete="off">
  <label>Get a free key at <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>. It is stored only in this browser.</label>
  <label for="model">Model</label>
  <select id="model"><option value="">Add your API key to load models</option></select>
  <label for="name">Address me as</label>
  <input type="text" id="name" placeholder="sir">
  <label for="maker">Creator name (what Jarvis says when asked who made it)</label>
  <input type="text" id="maker" placeholder="Rajveer Nandikar">
  <label for="city">Home city (used for weather)</label>
  <input type="text" id="city" placeholder="Kolhapur">
  <label for="lang">Speech recognition language</label>
  <select id="lang">
    <option value="">Auto-detect</option>
    <option value="en-IN">English (India)</option>
    <option value="en-US">English (US)</option>
    <option value="en-GB">English (UK)</option>
    <option value="hi-IN">Hindi</option>
    <option value="mr-IN">Marathi</option>
  </select>
  <label for="voice">Voice</label>
  <select id="voice"></select>
  <label for="rate">Speaking speed</label>
  <input type="range" id="rate" min=".7" max="1.5" step=".05">
  <label>Call dictionary</label>
  <div id="cl"></div>
  <div class="cadd"><input type="text" id="cn" placeholder="Name or aliases: Mom, Aai"><input type="text" id="cp" placeholder="+91 98765 43210" inputmode="tel"><button class="btn" type="button" id="ca">Add</button></div>
  <div class="hint">Say "call Mom" or "dial 9876543210". Calls open your phone or computer's calling app.</div>
  <label class="chk"><input type="checkbox" id="web"> Live web search for news, scores, prices, weather</label>
  <label class="chk"><input type="checkbox" id="barge"> Interrupt Jarvis by talking (use headphones if it cuts itself off)</label>
  <button class="btn" type="button" id="wipe" style="margin-top:16px;width:100%">Clear memory and history</button>
  <div class="row">
    <button class="btn" type="button" id="test">Test voice</button>
    <button class="btn pri" type="button" id="close">Done</button>
  </div>
</dialog>
<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const PERSONAS = {
  jarvis:{n:'J.A.R.V.I.S.',c:'#35d0ff',c2:'#7a5cff',v:/Daniel|UK English Male|Rishi|Ryan|Guy/i,p:'a refined, calm British AI butler with dry wit, impeccable manners and total loyalty.'},
  friday:{n:'F.R.I.D.A.Y.',c:'#ff5cc8',c2:'#ffb35c',v:/Samantha|Zira|UK English Female|Heera|Jenny|Female/i,p:'a warm, upbeat and quick AI with a friendly Irish lilt: casual, encouraging and a little cheeky.'},
  alfred:{n:'A.L.F.R.E.D.',c:'#f5c35c',c2:'#c0803a',v:/Daniel|UK English Male|Rishi|Ryan/i,p:'a dignified old-world butler: formal, wise, gentle and quietly sarcastic when warranted.'},
  nova:{n:'N.O.V.A.',c:'#4dff9a',c2:'#2fb7ff',v:/Google US English|Aria|Zira|Jenny|Female/i,p:'an energetic, curious AI companion from the near future: enthusiastic, concise and playful.'}
};
const TZ = 'Asia/Kolkata';
const D = {theme:'light',city:'Kolhapur',maker:'Rajveer Nandikar',contacts:[],key:'',model:'llama-3.3-70b-versatile',voice:'',rate:1.05,lang:'en-IN',name:'sir',persona:'jarvis',web:true,barge:true,mem:[],notes:[],hist:[]};
const S = Object.assign({}, D, {state:'idle',live:false,abort:null});
try { Object.assign(S, JSON.parse(localStorage.getItem('jarvis') || '{}')); } catch {}
S.city = S.city || 'Kolhapur'; S.maker = S.maker || 'Rajveer Nandikar';
const save = () => { try { const o = {}; Object.keys(D).forEach(k => o[k] = S[k]); o.hist = S.hist.slice(-30); localStorage.setItem('jarvis', JSON.stringify(o)); } catch {} };

const VISION = 'meta-llama/llama-4-scout-17b-16e-instruct', COMP = 'groq/compound-mini', API = 'https://api.groq.com/openai/v1/';
const WEBQ = /\b(news|latest|today|tonight|tomorrow|yesterday|current|currently|right now|score|scores|price|prices|stock|weather|forecast|temperature|who won|who is the|trending|release date|exchange rate|update on|this week|this year)\b/i;
const LOOK = /\b(see|seeing|look|looking|show|showing|camera|screen|this|that|these|those|holding|wearing|read|picture|image|here|describe|what is|what's)\b/i;
const HALL = /^(thank you\.?|thanks for watching[.!]?|you|bye\.?|\.+)$/i;
const synth = window.speechSynthesis, orb = $('#orb'), pv = $('#pv');
const EMPTY = $('#log').innerHTML, W = $('#wave');
for (let i = 0; i < 33; i++) { const b = document.createElement('i'); b.style.setProperty('--k', ((1 - Math.abs(i-16)/18) * (.55 + .45*Math.abs(Math.sin(i*1.7)))).toFixed(2)); W.append(b); }
const LABEL = {idle:'Standby',listening:'Listening',thinking:'Thinking',speaking:'Speaking'};
const HINT  = {idle:'Tap the core to talk',listening:'Listening… tap to stop',thinking:'Tap to cancel',speaking:'Talk or tap to interrupt'};

/* ---------- Speech output ---------- */
function speak(t){
  t = t.replace(/https?:\/\/\S+/g,'link').replace(/[*_#`~>|]/g,'').replace(/\s+/g,' ').trim();
  if (!t || !synth) return;
  const g = gen, u = new SpeechSynthesisUtterance(t);
  const v = synth.getVoices().find(v => v.name === S.voice);
  if (v) { u.voice = v; u.lang = v.lang; }
  u.rate = S.rate; u.pitch = .95; q++;
  u.onstart = () => { if (g===gen) setState('speaking'); };
  u.onend = u.onerror = () => { if (g!==gen) return; q--; if (q<=0 && streamDone) finish(); };
  synth.speak(u);
}
const say = t => { addMsg('ai', t); mirror(t); speak(t); };
function stopSpeak(){ gen++; q=0; streamDone=true; synth && synth.cancel(); }
function finish(){ if (S.live) listen(); else setState('idle'); }
const back = finish;

/* ---------- Mic: Whisper + voice activity + barge-in + reactive orb ---------- */
let stream, ctx, an, b8, mr, rcT = 0, heard = false, loud = 0, last = 0, pt = 0, lv = 0, sl = 0;
async function mic(){
  if (stream) { if (ctx.state==='suspended') await ctx.resume(); return true; }
  try { stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch { toast('Microphone access is blocked. Allow it in your browser settings.'); return false; }
  ctx = new (window.AudioContext || window.webkitAudioContext)(); an = ctx.createAnalyser(); an.fftSize = 512; b8 = new Uint8Array(512);
  ctx.createMediaStreamSource(stream).connect(an); return true;
}
function rcStart(){
  if (!stream || (mr && mr.state==='recording')) return;
  heard = false; loud = 0;
  const m = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
  const my = mr = new MediaRecorder(stream, m ? {mimeType:m} : {}); my.ch = []; my.keep = false;
  my.ondataavailable = e => e.data.size && my.ch.push(e.data);
  my.onstop = () => {
    if (!my.keep) return;
    const b = new Blob(my.ch, {type: my.mimeType || 'audio/webm'});
    b.size > 2500 ? transcribe(b) : back();
  };
  my.start(); rcT = performance.now();
}
function rcStop(keep){ if (mr && mr.state==='recording') { mr.keep = keep; mr.stop(); } }
async function listen(){
  if (!(await mic())) { S.live = false; setState('idle'); return; }
  rcStop(false); heard = false; loud = 0; setState('listening');
}
async function transcribe(blob){
  const id = ++trId;
  try {
    const f = new FormData();
    f.append('file', blob, blob.type.includes('mp4') ? 'a.mp4' : 'a.webm');
    f.append('model', 'whisper-large-v3-turbo'); f.append('temperature', '0');
    const l = (S.lang || '').slice(0,2); if (l) f.append('language', l);
    const r = await fetch(API+'audio/transcriptions', {method:'POST', headers:{Authorization:'Bearer '+S.key}, body:f});
    if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error?.message || 'Transcription failed ('+r.status+')');
    const t = ((await r.json()).text || '').trim();
    if (id !== trId || !S.live) return;
    if (t.replace(/[^\p{L}\p{N}]/gu,'').length > 1 && !HALL.test(t)) send(t); else back();
  } catch (e) { S.live = false; setState('idle'); addMsg('err', e.message); }
}
function tick(now){
  const dt = Math.min(100, now - pt); pt = now; const st = S.state; let l = 0;
  if (an) { an.getByteTimeDomainData(b8); let s = 0; for (const v of b8) { const x = (v-128)/128; s += x*x; } lv = Math.sqrt(s/b8.length); }
  if (st==='listening') l = Math.min(1, lv*7);
  else if (st==='speaking') l = .16 + .16*Math.abs(Math.sin(now/105))*(.65 + .35*Math.sin(now/41));
  else if (st==='thinking') l = .08;
  sl += (l - sl) * .35; orb.style.setProperty('--lv', sl.toFixed(3)); W.style.setProperty('--lv', sl.toFixed(3));
  const sp = st==='speaking' && S.barge;
  if (S.live && an && (st==='listening' || sp)) {
    rcStart();
    const th = sp ? .08 : .03;
    if (lv > th) { loud += dt; last = now; } else loud = Math.max(0, loud - dt);
    if (!heard && loud > (sp ? 320 : 140)) { heard = true; if (sp) { interrupt(); setState('listening'); } }
    if (heard && now - last > 950) { heard = false; loud = 0; rcStop(true); setState('thinking'); }
    else if (!heard && now - rcT > 25000) rcStop(false);
  }
}
try { const w = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),40)']))); w.onmessage = () => tick(performance.now()); }
catch { setInterval(() => tick(performance.now()), 40); }

/* ---------- Groq models ---------- */
const PREFER = ['llama-3.3-70b-versatile','openai/gpt-oss-120b','openai/gpt-oss-20b','llama-3.1-8b-instant'];
async function loadModels(){
  if (!S.key) return;
  try {
    const r = await fetch(API+'models', {headers:{Authorization:'Bearer '+S.key}});
    if (!r.ok) throw new Error(r.status);
    ALL = (await r.json()).data.map(m => m.id);
    const ids = ALL.filter(id => !/whisper|tts|guard|orpheus|playai|embed|compound|safeguard/i.test(id)).sort();
    if (!ids.length) return;
    const sel = $('#model'); sel.innerHTML = '';
    ids.forEach(id => sel.append(new Option(id, id)));
    if (!ids.includes(S.model)) S.model = PREFER.find(p => ids.includes(p)) || ids[0];
    sel.value = S.model; save();
  } catch {}
}

/* ---------- Vision ---------- */
async function vision(kind){
  if (vs) { const k = vs.kind; stopV(); if (k === kind) return; }
  try {
    const s = kind==='cam' ? await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}) : await navigator.mediaDevices.getDisplayMedia({video:true});
    vs = s; s.kind = kind; pv.srcObject = s; pv.style.display = 'block'; pv.play();
    s.getVideoTracks()[0].onended = stopV;
    $('#cam').classList.toggle('on', kind==='cam'); $('#scr').classList.toggle('on', kind==='scr');
    toast(kind==='scr' ? 'Screen shared. Ask me about it.' : 'Camera on. Ask me what you see.');
    if (kind==='scr' && !pip) popOut(true);
  } catch { toast(kind==='cam' ? 'Camera access was blocked.' : 'Screen sharing was cancelled.'); }
}
function stopV(){ vs?.getTracks().forEach(t => t.stop()); vs = null; pv.style.display = 'none'; pv.srcObject = null; $('#cam').classList.remove('on'); $('#scr').classList.remove('on'); }
function frame(){
  const w = Math.min(1600, pv.videoWidth), h = Math.round(pv.videoHeight*w/pv.videoWidth), c = document.createElement('canvas');
  c.width = w; c.height = h; c.getContext('2d').drawImage(pv, 0, 0, w, h); return c.toDataURL('image/jpeg', .8);

const NUM = {a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,fifteen:15,twenty:20,thirty:30,forty:40,sixty:60,half:.5};

function findContact(t){
  const k = t.toLowerCase().replace(/^(my|to|the)\s+/, '').replace(/[.,!?]/g, '').trim();
  const al = c => c.n.toLowerCase().split(/[,\/]/).map(s => s.trim()).filter(Boolean);

}

  S.contacts.forEach((c, i) => {
    const r = document.createElement('div'), n = document.createElement('b'), p = document.createElement('span'), a = document.createElement('a'), x = document.createElement('button');

function act(t){
  const s = t.trim().replace(/[.!?]+$/,''); let m;
  if (/^what('?s| is)? ?(the )?(current )?time( is it)?( now)?$|^what time is it/i.test(s)) return 'It is ' + new Date().toLocaleTimeString('en-IN', {hour:'numeric',minute:'2-digit',timeZone:TZ}) + '.';
  if (/what('?s| is) (the )?(date|day)|what day is (it|today)|today'?s date/i.test(s)) return 'Today is ' + new Date().toLocaleDateString('en-IN', {weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:TZ}) + '.';
  if ((m = s.match(/(?:timer|remind(?:er)?|alarm)\b.*?\b(?:for|in|after)\s+(\d+(?:\.\d+)?|an?|one|two|three|four|five|six|seven|eight|nine|ten|fifteen|twenty|thirty|forty|sixty|half)\s*(?:an? )?(second|minute|min|hour)s?\b\s*(?:(?:to|that|about)\s+(.+))?/i))) {
    const n = NUM[m[1].toLowerCase()] ?? parseFloat(m[1]), what = m[3], u = m[2] === 'min' ? 'minute' : m[2];
    setTimeout(() => say(what ? 'Reminder: ' + what + '.' : 'Your ' + n + ' ' + u + (n===1?'':'s') + ' timer is up.'), n * UNIT[m[2]] * 1000);
    return 'Done. I will tell you in ' + n + ' ' + u + (n===1?'':'s') + (what ? ' to ' + what : '') + '.';
  }
  if ((m = s.match(/^(?:take|make|add|save|write)(?: me)?(?: an?)? note(?: that| to| saying)?[:,]?\s+(.+)/i) || s.match(/^note (?:that |down )?(.+)/i))) { S.notes.push(m[1]); save(); return 'Noted.'; }
  if (/^(?:read|what are|show)(?: me)?(?: my)? notes/i.test(s)) return S.notes.length ? 'You have ' + S.notes.length + ' note' + (S.notes.length>1?'s':'') + '. ' + S.notes.map((x,i) => (i+1) + ': ' + x).join('. ') : 'You have no notes yet.';
  if (/^(?:clear|delete)(?: all)?(?: my)? notes/i.test(s)) { S.notes = []; save(); return 'Notes cleared.'; }
  if ((m = s.match(/\bmy name is ([\p{L}]+)/iu))) { S.name = m[1]; $('#name').value = m[1]; S.mem = S.mem.filter(x => !/^The user's name/.test(x)); S.mem.push("The user's name is " + m[1]); save(); return 'Pleasure to meet you, ' + m[1] + '. I will remember that.'; }
  if ((m = s.match(/^remember (?:that )?(.+)/i))) { S.mem.push(m[1]); save(); return 'Understood. I will remember that.'; }
  if (/^what do you (?:remember|know) about me/i.test(s)) return S.mem.length ? 'Here is what I remember. ' + S.mem.join('. ') + '.' : 'I do not know anything about you yet. Tell me to remember something.';
  if (/^(?:forget everything|clear (?:your )?memory|forget (?:it )?all)/i.test(s)) { S.mem = []; S.notes = []; S.hist = []; save(); $('#log').innerHTML = EMPTY; return 'Memory cleared.'; }

    const t2 = m[1].trim(), digits = t2.replace(/[\s\-().]/g, '');
    if (/^\+?\d{3,15}$/.test(digits)) { dial(digits, digits); return 'Calling ' + t2 + '.'; }
    const c = findContact(t2);
    if (c) { const nm = c.n.split(/[,\/]/)[0].trim(); dial(nm, c.p.replace(/[^\d+]/g, '')); return 'Calling ' + nm + '.'; }
    return 'I do not have ' + t2 + ' in your call dictionary. Add them in settings, or tell me the number.';
  }
  if ((m = s.match(/^play (.+?)(?: on (?:youtube|you tube))?$/i))) { go('https://www.youtube.com/results?search_query=' + encodeURIComponent(m[1])); return 'Playing ' + m[1] + ' on YouTube.'; }

    const k = m[1].toLowerCase().trim(), d = SITES[k] || (/^[\w-]+(\.[\w-]+)+$/.test(k) ? k : null);

}

/* ---------- Live weather (Open-Meteo, no key needed) ---------- */
const WC = {0:'clear sky',1:'mainly clear',2:'partly cloudy',3:'overcast',45:'fog',48:'fog',51:'light drizzle',53:'drizzle',55:'heavy drizzle',61:'light rain',63:'rain',65:'heavy rain',71:'light snow',73:'snow',75:'heavy snow',80:'rain showers',81:'rain showers',82:'violent rain showers',95:'a thunderstorm',96:'a thunderstorm with hail',99:'a thunderstorm with hail'};
async function weatherFacts(text){
  try {
    const m = text.match(/\b(?:in|for|at)\s+([A-Za-z][A-Za-z .'-]{1,38}?)(?:\s+(?:today|tomorrow|tonight|now|right now|this (?:week|weekend)))?\s*[?.!]?$/i);
    const city = m && !/^(the|my|this|today|tomorrow)$/i.test(m[1].trim()) ? m[1].trim() : (S.city || 'Kolhapur');
    let lat, lon, place = city;
    if (city) {
      const g = await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name=' + encodeURIComponent(city) + (city.toLowerCase() === 'kolhapur' ? '&countryCode=IN' : ''))).json();
      if (!g.results?.length) return 'Weather lookup failed: the place "' + city + '" was not found. Ask the user to repeat the city.';
      ({latitude: lat, longitude: lon, name: place} = g.results[0]);
    } else {
      const pos = await new Promise((ok, no) => navigator.geolocation ? navigator.geolocation.getCurrentPosition(ok, no, {timeout:8000}) : no());
      lat = pos.coords.latitude; lon = pos.coords.longitude; place = "the user's current location";
    }
    const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=2`)).json();
    const c = w.current, d = w.daily, tm = /tomorrow/i.test(text) ? 1 : 0;
    return `Place: ${place}. Now: ${Math.round(c.temperature_2m)} degrees Celsius (feels like ${Math.round(c.apparent_temperature)}), ${WC[c.weather_code] || 'unclear conditions'}, humidity ${c.relative_humidity_2m} percent, wind ${Math.round(c.wind_speed_10m)} kilometres per hour. ${tm ? 'Tomorrow' : 'Today'}: ${WC[d.weather_code[tm]] || 'mixed conditions'}, high ${Math.round(d.temperature_2m_max[tm])}, low ${Math.round(d.temperature_2m_min[tm])}, chance of rain ${d.precipitation_probability_max[tm]} percent.`;
  } catch {
    return 'Weather lookup failed. Tell the user you could not get the weather, and suggest saying the weather in a specific city, or setting a home city in settings.';
  }
}

              raw += t;
              const v = raw.replace(/<think>[\s\S]*?(?:<\/think>|$)/g,'').replace(/<(?:t(?:h(?:i(?:n(?:k)?)?)?)?)?$/,'').replace(/^\s+/,'');
              if (v.length > full.length) { buf += v.slice(full.length); full = v; el.textContent = full; mirror(full); $('#log').scrollTop = $('#log').scrollHeight; if (g===gen) flush(false); }
            }
          } catch {}
        }
      }
    }
    if (g !== gen) return;
    flush(true); streamDone = true;
    S.hist.push({role:'assistant', content:full}); save();
    if (q <= 0) finish();
  } catch (e) {
    if (e.name === 'AbortError') { if (full.trim()) { S.hist.push({role:'assistant', content:full}); save(); } else el.remove(); return; }
    el.remove(); streamDone = true; S.live = false;
    addMsg('err', e.status===401 ? 'Invalid Groq API key. Check it in settings.' : e.status===429 ? 'Rate limit reached. Wait a moment and try again.' : (e.message || 'Something went wrong.'));
    if (e.status===401) $('#dlg').showModal();
    if (e.status===404 || /does not exist|decommission/i.test(e.message)) { ALL = []; loadModels().then(() => toast('Switched to ' + S.model + '. Try again.')); }
    setState('idle');
  }
}

/* ---------- Daily briefing ---------- */
const BRIEF = /^\s*(?:(?:hey|hi|hello)\s+)?(?:jarvis[,\s]+)?(?:good\s+(?:morning|afternoon|evening)|(?:my\s+|the\s+)?(?:daily\s+|morning\s+)?briefing|brief\s+me|give\s+me\s+(?:my|the)\s+(?:daily\s+|morning\s+)?briefing)\b/i;
async function briefFacts(){
  const now = new Date();
  const hr = +now.toLocaleTimeString('en-GB', {hour:'2-digit', hour12:false, timeZone:TZ}), part = hr < 12 ? 'morning' : hr < 17 ? 'afternoon' : 'evening';
  const wx = await weatherFacts('weather today');
  return `DAILY BRIEFING REQUESTED. Greet the user back warmly, then say the date and time, then the weather, then mention their notes if there are any. Three or four short spoken sentences, no lists. Date: ${now.toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long', timeZone:TZ})}. Time in India: ${now.toLocaleTimeString('en-IN', {hour:'numeric', minute:'2-digit', timeZone:TZ})} (it is ${part}). Weather in ${S.city || 'Kolhapur'}: ${wx}${S.notes.length ? ' Notes saved: ' + S.notes.slice(-5).join('; ') + '.' : ''}`;
}

/* ---------- Documents (PDF / text Q&A) ---------- */
const DOC = {name:'', info:'', chunks:[]};
const STOP = new Set('the a an and or of to in on for with is are was were be this that it as at by from what which who how why when where does do did about tell me please can you document file pdf say says'.split(' '));
const words = s => (s.toLowerCase().match(/[\p{L}\p{N}]{3,}/gu) || []).filter(w => !STOP.has(w));
let pdfLib;
async function pdfjs(){
  if (pdfLib) return pdfLib;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await new Promise((ok, no) => { const s = document.createElement('script'); s.src = base + 'pdf.min.js'; s.onload = ok; s.onerror = no; document.head.append(s); });
  const w = await (await fetch(base + 'pdf.worker.min.js')).text();
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([w], {type:'text/javascript'}));
  return pdfLib = window.pdfjsLib;
}
function chunkPages(pages){
  const out = [], push = (t, p) => { t = t.trim(); if (t) out.push({t, p, l:t.toLowerCase()}); };
  for (const [p, txt] of pages) {
    let cur = '';
    for (const s of txt.replace(/[ \t]+/g, ' ').split(/(?<=[.!?])\s+|\n+/)) {
      if (cur && (cur + ' ' + s).length > 900) { push(cur, p); cur = ''; }
      cur += ' ' + s;
      while (cur.length > 1400) { push(cur.slice(0, 1000), p); cur = cur.slice(1000); }
    }
    push(cur, p);
  }
  return out;
}
async function addDoc(f){
  try {
    toast('Reading ' + f.name + '…');
    const pages = []; let info;
    if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf') {
      const pdf = await (await pdfjs()).getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
      for (let i = 1; i <= Math.min(pdf.numPages, 250); i++) {
        const tc = await (await pdf.getPage(i)).getTextContent();
        pages.push([i, tc.items.map(x => x.str).join(' ')]);
      }
      info = pdf.numPages + ' page' + (pdf.numPages > 1 ? 's' : '');
    } else {
      const t = (await f.text()).slice(0, 2000000); pages.push([0, t]); info = Math.max(1, Math.round(t.length / 1000)) + 'k characters';
    }
    const ch = chunkPages(pages);
    if (ch.reduce((s, c) => s + c.t.length, 0) < 40) return toast('No readable text found. For a scanned PDF, attach a photo of the page instead.');
    Object.assign(DOC, {name:f.name, info, chunks:ch}); renderAtt(); toast('Document ready. Ask me about it.');
  } catch { toast('Could not read that document. Check your internet connection and try again.'); }
}
function docContext(q){
  const C = DOC.chunks; if (!C.length) return '';
  let pick; const qw = [...new Set(words(q))];
  if (!qw.length || /\b(summar|overview|main points|key points|tl;?dr|what is (?:this|the) (?:doc|document|file|pdf)|about this)/i.test(q)) {
    const n = Math.min(6, C.length);
    pick = [...new Set(Array.from({length:n}, (_, i) => Math.round(i * (C.length - 1) / Math.max(1, n - 1))))];
  } else {
    const df = {}; qw.forEach(w => df[w] = C.filter(c => c.l.includes(w)).length);
    const sc = C.map((c, i) => [qw.reduce((s, w) => { const m = c.l.split(w).length - 1; return s + (m ? (1 + Math.log(m)) * Math.log(1 + C.length / (1 + df[w])) : 0); }, 0), i]);
    pick = sc.sort((a, b) => b[0] - a[0]).slice(0, 6).filter(x => x[0] > 0).map(x => x[1]);
    if (!pick.length) pick = [0, 1].filter(i => i < C.length);
    pick.sort((a, b) => a - b);
  }
  return pick.map(i => '[' + (C[i].p ? 'page ' + C[i].p : 'part ' + (i + 1)) + '] ' + C[i].t).join('\n');
}
function addFiles(fs){
  const im = fs.filter(f => f.type.startsWith('image/')), dc = fs.find(f => !f.type.startsWith('image/'));
  if (im.length) addImgs(im); if (dc) addDoc(dc);
}

/* ---------- Images ---------- */
const vmodel = () => ALL.filter(id => /^qwen\/qwen3[\w.]*-27b$|llama-4-(?:scout|maverick)|vision/i.test(id))
  .sort((a,b) => (/qwen/.test(b)?1:0) - (/qwen/.test(a)?1:0) || b.localeCompare(a, undefined, {numeric:true}))[0];
async function addImgs(fs){
  for (const f of fs) {
    if (IMG.length >= 3) { toast('Up to 3 images at a time.'); break; }
    try {
      const bm = await createImageBitmap(f), sc = Math.min(1, 1280 / Math.max(bm.width, bm.height)), c = document.createElement('canvas');
      c.width = Math.round(bm.width*sc); c.height = Math.round(bm.height*sc);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(bm, 0, 0, c.width, c.height);
      IMG.push(c.toDataURL('image/jpeg', .85)); IMGNEW = true;
    } catch { toast('Could not read that image.'); }
  }
  renderAtt(); if (IMG.length) toast('Image attached. Ask me about it.');
}
function renderAtt(){
  const a = $('#att'); a.innerHTML = ''; a.classList.toggle('on', IMG.length > 0 || !!DOC.name);
  IMG.forEach((u,i) => {
    const d = document.createElement('div'), im = new Image(), b = document.createElement('button');
    d.className = 'th'; im.src = u; b.type = 'button'; b.textContent = '×'; b.setAttribute('aria-label', 'Remove image');
    b.onclick = () => { IMG.splice(i,1); renderAtt(); }; d.append(im, b); a.append(d);
  });
  if (DOC.name) {
    const d = document.createElement('div'), n = document.createElement('b'), i = document.createElement('span'), x = document.createElement('button');
    d.className = 'dchip'; n.textContent = DOC.name; i.textContent = DOC.info;
    x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', 'Remove document');
    x.onclick = () => { Object.assign(DOC, {name:'', info:'', chunks:[]}); renderAtt(); };
    d.append(n, i, x); a.append(d);
  }
}

/* ---------- Floating ask bar (Document Picture-in-Picture) ---------- */
const PIPCSS = `*{box-sizing:border-box;margin:0}body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding:10px;display:flex;flex-direction:column;gap:8px;height:100vh;--c:#35d0ff}
.h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}.h i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}.h b{color:var(--text);letter-spacing:.15em;font-weight:600}.h span{flex:1}
button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}button:hover{border-color:var(--c)}
#pr{flex:1;overflow:auto;font-size:13px;color:var(--text);min-height:0;white-space:pre-wrap}
form{display:flex;gap:6px}input{flex:1;min-width:0;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}input:focus{outline:none;border-color:var(--c)}form button{background:var(--c);color:#02101a;border:0;font-weight:600}`;
const mirror = t => { if (pip) { const e = pip.document.getElementById('pr'); if (e) e.textContent = t; } };
function pipUI(){
  if (!pip) return; const d = pip.document, s = d.getElementById('ps'); if (!s) return;
  s.textContent = LABEL[S.state]; d.getElementById('pm').textContent = S.live ? 'Stop' : 'Talk';
  const cs = getComputedStyle(document.body); ['--c','--bg','--panel','--line','--text','--mute'].forEach(k => d.body.style.setProperty(k, cs.getPropertyValue(k)));
}
async function popOut(quiet){
  if (pip) { pip.close(); return; }
  if (!window.documentPictureInPicture) return toast('The floating bar needs Chrome or Edge.');
  try { pip = await documentPictureInPicture.requestWindow({width:440, height:200}); }
  catch { return toast(quiet ? 'Tap the pop-out button to float a question bar over your screen.' : 'Could not open the floating bar.'); }
  const d = pip.document;
  d.head.innerHTML = `<meta charset="utf-8"><title>Ask</title><style>${PIPCSS}</style>`;
  d.body.innerHTML = `<div class="h"><i></i><b>${(PERSONAS[S.persona] || PERSONAS.jarvis).n}</b><span id="ps"></span><button id="pm" type="button"></button></div><div id="pr">Ask me anything about what is on your screen.</div><form id="pf" autocomplete="off"><input id="pi" placeholder="Ask about your screen…"><button>Ask</button></form>`;
  d.getElementById('pf').onsubmit = e => { e.preventDefault(); const i = d.getElementById('pi'), v = i.value.trim(); if (v) { i.value = ''; send(v); } };
  d.getElementById('pm').onclick = main;
  pip.addEventListener('pagehide', () => { pip = null; $('#pop').classList.remove('on'); });
  $('#pop').classList.add('on'); pipUI(); d.getElementById('pi').focus();
}

/* ---------- Controls ---------- */
function interrupt(){ trId++; S.abort?.abort(); stopSpeak(); }
function main(){
  if (S.state==='speaking' || S.state==='thinking') { interrupt(); if (S.live) listen(); else setState('idle'); return; }
  if (S.live) { S.live = false; rcStop(false); setState('idle'); }
  else { if (!S.key) { $('#dlg').showModal(); return; } S.live = true; listen(); }
}
orb.onclick = main; $('#mic').onclick = main;
$('#img').onclick = () => $('#fi').click();
$('#fi').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
$('#pop').onclick = () => popOut();
document.addEventListener('paste', e => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); addFiles(fs); } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); const fs = [...(e.dataTransfer?.files || [])]; if (fs.length) addFiles(fs); });
$('#cam').onclick = () => vision('cam'); $('#scr').onclick = () => vision('scr');
$('#form').onsubmit = e => { e.preventDefault(); const v=$('#txt').value.trim(); if (!v) return; $('#txt').value=''; send(v); };
$('#clear').onclick = () => { interrupt(); rcStop(false); S.live=false; S.hist=[]; save(); $('#log').innerHTML=EMPTY; setState('idle'); };
document.addEventListener('keydown', e => {
  if (e.code==='Space' && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName) && !$('#dlg').open) { e.preventDefault(); main(); }
});

/* ---------- Settings ---------- */
function loadVoices(){
  if (!synth) return;
  const vs = synth.getVoices(), sel = $('#voice'); sel.innerHTML = '';
  vs.forEach(v => sel.append(new Option(v.name+' ('+v.lang+')', v.name)));
  if (!vs.some(v => v.name===S.voice)) {
    const P = PERSONAS[S.persona] || PERSONAS.jarvis;
    const p = vs.find(v => P.v.test(v.name)) || vs.find(v => v.lang.startsWith('en')) || vs[0];
    if (p) { S.voice = p.name; save(); }
  }
  sel.value = S.voice;
}
if (synth) { synth.onvoiceschanged = loadVoices; loadVoices(); }
Object.entries(PERSONAS).forEach(([k,p]) => $('#persona').append(new Option(p.n.replace(/\./g,''), k)));
$('#persona').value = S.persona; $('#key').value = S.key; $('#model').value = S.model; $('#lang').value = S.lang; $('#name').value = S.name; $('#city').value = S.city; $('#maker').value = S.maker; $('#rate').value = S.rate;
$('#web').checked = S.web; $('#barge').checked = S.barge;
$('#persona').onchange = e => { S.persona = e.target.value; applyP(); const v = synth && synth.getVoices().find(v => PERSONAS[S.persona].v.test(v.name)); if (v) { S.voice = v.name; $('#voice').value = v.name; } save(); };
$('#key').oninput   = e => { S.key = e.target.value.trim(); save(); ALL = []; clearTimeout(modelT); modelT = setTimeout(loadModels, 600); };
$('#model').onchange= e => { S.model = e.target.value; save(); };
$('#lang').onchange = e => { S.lang = e.target.value; save(); };
$('#name').oninput  = e => { S.name = e.target.value.trim(); save(); };
$('#city').oninput  = e => { S.city = e.target.value.trim(); save(); };
$('#maker').oninput = e => { S.maker = e.target.value.trim() || 'Rajveer Nandikar'; save(); };
$('#ca').onclick = () => {
  const n = $('#cn').value.trim(), p = $('#cp').value.trim();
  if (!n || p.replace(/\D/g, '').length < 3) return toast('Enter a name and a valid number.');
  S.contacts.push({n, p}); save(); $('#cn').value = $('#cp').value = ''; renderContacts();
};
renderContacts();
$('#voice').onchange= e => { S.voice = e.target.value; save(); };
$('#rate').oninput  = e => { S.rate = +e.target.value; save(); };
$('#web').onchange  = e => { S.web = e.target.checked; save(); };
$('#barge').onchange= e => { S.barge = e.target.checked; save(); };
$('#wipe').onclick  = () => { S.mem = []; S.notes = []; S.hist = []; save(); $('#log').innerHTML = EMPTY; toast('Memory and history cleared.'); };
$('#test').onclick  = () => { synth.cancel(); speak('All systems are online and ready when you are, ' + (S.name || 'sir') + '.'); };
$('#cfg').onclick   = () => $('#dlg').showModal();
$('#theme').onclick = () => { S.theme = S.theme==='dark' ? 'light' : 'dark'; applyTheme(); save(); };
$('#log').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) send(b.dataset.q); });
$('#close').onclick = () => $('#dlg').close();
if (!S.key) $('#dlg').showModal(); else loadModels();

</script>
