<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<style>
:root{
  --bg:#060a12;--panel:#0b1220;--panel2:#101a2e;--line:#1a2842;--text:#e8f1ff;--mute:#7f91ae;
  --c:#35d0ff;--c2:#7a5cff;--danger:#ff6b7a;color-scheme:dark;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font:15px/1.55 var(--font);color:var(--text);background:
    radial-gradient(900px 500px at 50% -10%,color-mix(in srgb,var(--c) 14%,transparent),transparent 70%),var(--bg);
  display:flex;flex-direction:column;max-width:880px;margin:0 auto;
  padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0);
  transition:--c .4s;
}
body[data-state=listening]{--c:#3dffb0;--d:1.2s}
body[data-state=thinking]{--c:#a58bff;--d:.9s}
body[data-state=speaking]{--c:#35d0ff;--d:.6s}

header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px}
.brand{font-weight:650;letter-spacing:.22em;font-size:14px}
.brand small{display:block;font-weight:400;letter-spacing:.04em;color:var(--mute);font-size:12px;margin-top:2px}
.hr{display:flex;align-items:center;gap:10px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-size:13px;color:var(--mute)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.ib{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;cursor:pointer;transition:border-color .2s,background .2s}
.ib:hover{border-color:var(--c);background:var(--panel2)}
:focus-visible{outline:2px solid var(--c);outline-offset:3px}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 0 10px}
.orb{--size:min(220px,50vw);position:relative;width:var(--size);height:var(--size);border:0;background:none;padding:0;border-radius:50%;cursor:pointer;color:inherit}
.orb i{position:absolute;border-radius:50%;pointer-events:none}
.orb .core{inset:23%;background:radial-gradient(circle at 36% 30%,#ffffffcc,var(--c) 34%,color-mix(in srgb,var(--c) 28%,#000) 82%);
  box-shadow:0 0 70px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 30px #0009;animation:breathe var(--d,4.2s) ease-in-out infinite}
.orb .r1{inset:0;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);border-top-color:transparent;animation:spin 16s linear infinite}
.orb .r2{inset:10%;border:2px solid transparent;border-top-color:var(--c);border-bottom-color:var(--c2);opacity:.85;animation:spin 7s linear infinite reverse}
.orb .r3{inset:-9%;border:1px dashed color-mix(in srgb,var(--c) 28%,transparent);animation:spin 46s linear infinite}
body[data-state=thinking] .orb .r2{animation-duration:1.3s}
body[data-state=listening] .orb .r1{animation-duration:6s}
@keyframes breathe{50%{transform:scale(1.09)}}
@keyframes spin{to{transform:rotate(360deg)}}
#hint{font-size:13px;color:var(--mute)}
#cap{min-height:24px;max-width:600px;text-align:center;color:var(--text);opacity:.9;padding:0 8px}

#log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px 2px;scroll-behavior:smooth;
  mask-image:linear-gradient(transparent,#000 14px)}
#empty{margin:auto;text-align:center;color:var(--mute);max-width:360px}
.msg{max-width:84%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line)}
.msg.user{align-self:flex-end;background:color-mix(in srgb,var(--c2) 22%,var(--panel));border-color:color-mix(in srgb,var(--c2) 40%,var(--line));border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel);border-bottom-left-radius:4px}
.msg.err{align-self:center;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:transparent;font-size:13px}

form.bar{display:flex;gap:8px;padding:10px 0 16px}
form.bar input{flex:1;min-width:0;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
form.bar input::placeholder{color:var(--mute)}
form.bar input:focus{outline:none;border-color:var(--c)}
.btn{height:48px;min-width:48px;padding:0 14px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font:inherit}
.btn:hover{border-color:var(--c)}
#mic.on{background:var(--c);color:#02121a;border-color:var(--c)}
.btn.pri{background:linear-gradient(135deg,var(--c),var(--c2));border:0;color:#02101a}

dialog{margin:auto;width:min(440px,calc(100vw - 32px));padding:22px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
dialog::backdrop{background:#000a;backdrop-filter:blur(4px)}
dialog h2{font-size:17px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
dialog input[type=password],dialog input[type=text],dialog select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}
dialog input[type=range]{width:100%;accent-color:var(--c)}
dialog a{color:var(--c)}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:20px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(10px);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
@media (max-width:520px){.msg{max-width:92%}.stage{padding-top:10px}}
</style>
</head>
<body data-state="idle">
<header>
  <div class="brand">J.A.R.V.I.S.<small>Voice assistant on Groq</small></div>
  <div class="hr">
    <div class="chip"><i></i><span id="st">Standby</span></div>
    <button class="ib" id="clear" title="Clear conversation" aria-label="Clear conversation"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
    <button class="ib" id="cfg" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<section class="stage">
  <button class="orb" id="orb" aria-label="Talk to Jarvis"><i class="r3"></i><i class="r1"></i><i class="r2"></i><i class="core"></i></button>
  <div id="hint">Tap the core to talk</div>
  <div id="cap" aria-live="polite"></div>
</section>

<main id="log"><div id="empty">Systems online. Tap the core and start talking, or type below.</div></main>

<form class="bar" id="form" autocomplete="off">
  <button type="button" class="btn" id="mic" title="Toggle voice conversation (Space)" aria-label="Toggle voice conversation"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <input id="txt" placeholder="Message Jarvis" aria-label="Message">
  <button class="btn pri" type="submit" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</form>

<dialog id="dlg">
  <h2>Settings</h2>
  <label for="key">Groq API key</label>
  <input type="password" id="key" placeholder="gsk_..." autocomplete="off">
  <label>Get a free key at <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>. It is stored only in this browser.</label>
  <label for="model">Model</label>
  <select id="model">
    <option value="llama-3.3-70b-versatile">Llama 3.3 70B (smartest)</option>
    <option value="llama-3.1-8b-instant">Llama 3.1 8B (fastest)</option>
    <option value="meta-llama/llama-4-scout-17b-16e-instruct">Llama 4 Scout 17B</option>
  </select>
  <label for="name">Address me as</label>
  <input type="text" id="name" placeholder="sir">
  <label for="lang">Speech recognition language</label>
  <select id="lang">
    <option value="en-IN">English (India)</option>
    <option value="en-US">English (US)</option>
    <option value="en-GB">English (UK)</option>
    <option value="hi-IN">Hindi</option>
    <option value="mr-IN">Marathi</option>
  </select>
  <label for="voice">Voice</label>
  <select id="voice"></select>
  <label for="rate">Speaking speed</label>
  <input type="range" id="rate" min=".7" max="1.5" step=".05">
  <div class="row">
    <button class="btn" type="button" id="test">Test voice</button>
    <button class="btn pri" type="button" id="close">Done</button>
  </div>
</dialog>
<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const S = {key:'',model:'llama-3.3-70b-versatile',voice:'',rate:1.05,lang:'en-IN',name:'sir',hist:[],live:false,state:'idle',abort:null};
try { Object.assign(S, JSON.parse(localStorage.getItem('jarvis') || '{}')); } catch {}
const save = () => { try { localStorage.setItem('jarvis', JSON.stringify({key:S.key,model:S.model,voice:S.voice,rate:S.rate,lang:S.lang,name:S.name})); } catch {} };

const synth = window.speechSynthesis;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const EMPTY = $('#log').innerHTML;
const LABEL = {idle:'Standby',listening:'Listening',thinking:'Thinking',speaking:'Speaking'};
const HINT  = {idle:'Tap the core to talk',listening:'Listening… tap to stop',thinking:'Tap to cancel',speaking:'Tap to interrupt'};

let rec, gen = 0, q = 0, streamDone = true, toastT;

function setState(s){
  S.state = s; document.body.dataset.state = s;
  $('#st').textContent = LABEL[s]; $('#hint').textContent = HINT[s];
  $('#mic').classList.toggle('on', S.live);
  if (s !== 'listening') $('#cap').textContent = '';
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3200); }
function addMsg(role, text){
  const log=$('#log'); $('#empty')?.remove();
  const d=document.createElement('div'); d.className='msg '+role; d.textContent=text; log.append(d); log.scrollTop=log.scrollHeight; return d;
}

/* ---------- Speech output ---------- */
function speak(t){
  t = t.replace(/https?:\/\/\S+/g,'link').replace(/[*_#`~>|]/g,'').replace(/\s+/g,' ').trim();
  if (!t || !synth) return;
  const g = gen, u = new SpeechSynthesisUtterance(t);
  const v = synth.getVoices().find(v => v.name === S.voice);
  if (v) { u.voice = v; u.lang = v.lang; }
  u.rate = S.rate; u.pitch = .95; q++;
  u.onstart = () => { if (g===gen) setState('speaking'); };
  u.onend = u.onerror = () => { if (g!==gen) return; q--; if (q<=0 && streamDone) finish(); };
  synth.speak(u);
}
function stopSpeak(){ gen++; q=0; streamDone=true; synth && synth.cancel(); }
function finish(){ if (S.live) listen(); else setState('idle'); }

/* ---------- Speech input ---------- */
function killRec(){ if (rec) { rec.cancel = true; try { rec.abort(); } catch {} } }
function listen(){
  if (!SR) { S.live=false; setState('idle'); return toast('Voice input needs Chrome, Edge or Safari. You can still type.'); }
  killRec();
  const r = rec = new SR(); let text = '';
  r.lang = S.lang; r.interimResults = true; r.continuous = false;
  r.onstart = () => setState('listening');
  r.onresult = e => { text = [...e.results].map(x => x[0].transcript).join(''); $('#cap').textContent = text; };
  r.onerror = e => {
    if (e.error==='not-allowed' || e.error==='service-not-allowed') { S.live=false; r.cancel=true; setState('idle'); toast('Microphone access is blocked. Allow it in your browser settings.'); }
  };
  r.onend = () => {
    if (r.cancel) return;
    if (text.trim()) send(text.trim());
    else if (S.live) setTimeout(() => { if (S.live && S.state==='listening') listen(); }, 250);
    else setState('idle');
  };
  try { r.start(); } catch {}
}

/* ---------- Groq chat (streaming) ---------- */
const sys = () => `You are J.A.R.V.I.S., a sharp, warm and quietly witty AI assistant, speaking aloud in a live voice conversation. Address the user as "${S.name || 'sir'}" now and then, not every sentence. Keep replies to one to three short sentences unless asked for detail. Use plain spoken language only: no markdown, lists, emojis, asterisks or code blocks. Spell out symbols and numbers the way a person would say them. Reply in the language the user speaks. Current date and time: ${new Date().toLocaleString()}.`;

async function send(text){
  if (!S.key) { $('#dlg').showModal(); return toast('Add your Groq API key first.'); }
  killRec(); S.abort?.abort(); stopSpeak();
  const g = gen, ctl = S.abort = new AbortController();
  streamDone = false;
  addMsg('user', text); S.hist.push({role:'user', content:text});
  setState('thinking');
  const el = addMsg('ai', '…');
  let full = '', buf = '';
  const flush = last => {
    let m;
    while ((m = buf.match(/^([\s\S]*?[.!?]+["')\]]*)\s+/))) { speak(m[1]); buf = buf.slice(m[0].length); }
    if (buf.length > 140) { const i = buf.lastIndexOf(', '); if (i > 40) { speak(buf.slice(0,i+1)); buf = buf.slice(i+2); } }
    if (last && buf.trim()) { speak(buf); buf = ''; }
  };
  try {
    const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST', signal:ctl.signal,
      headers:{'Content-Type':'application/json', Authorization:'Bearer '+S.key},
      body: JSON.stringify({model:S.model, stream:true, temperature:.7, max_tokens:400,
        messages:[{role:'system',content:sys()}, ...S.hist.slice(-20)]})
    });
    if (!r.ok) { const j = await r.json().catch(()=>({})); const e = new Error(j.error?.message || 'Request failed ('+r.status+')'); e.status=r.status; throw e; }
    const rd = r.body.getReader(), dec = new TextDecoder(); let sse = '';
    for (;;) {
      const {done, value} = await rd.read(); if (done) break;
      sse += dec.decode(value, {stream:true});
      const lines = sse.split('\n'); sse = lines.pop();
      for (const l of lines) {
        if (!l.startsWith('data:')) continue;
        const d = l.slice(5).trim(); if (!d || d==='[DONE]') continue;
        try {
          const t = JSON.parse(d).choices[0].delta.content;
          if (t) { full += t; buf += t; el.textContent = full; $('#log').scrollTop = $('#log').scrollHeight; if (g===gen) flush(false); }
        } catch {}
      }
    }
    if (g !== gen) return;
    flush(true); streamDone = true;
    S.hist.push({role:'assistant', content:full});
    if (q <= 0) finish();
  } catch (e) {
    if (e.name === 'AbortError') { if (full.trim()) S.hist.push({role:'assistant', content:full}); else el.remove(); return; }
    el.remove(); streamDone = true; S.live = false;
    addMsg('err', e.status===401 ? 'Invalid Groq API key. Check it in settings.' : e.status===429 ? 'Rate limit reached. Wait a moment and try again.' : (e.message || 'Something went wrong.') );
    if (e.status===401) $('#dlg').showModal();
    setState('idle');
  }
}

/* ---------- Controls ---------- */
function interrupt(){ S.abort?.abort(); stopSpeak(); }
function main(){
  if (S.state==='speaking' || S.state==='thinking') { interrupt(); if (S.live) listen(); else setState('idle'); return; }
  if (S.live) { S.live=false; killRec(); setState('idle'); }
  else { if (!S.key) { $('#dlg').showModal(); return; } S.live=true; listen(); }
}
$('#orb').onclick = main;
$('#mic').onclick = main;
$('#form').onsubmit = e => { e.preventDefault(); const v=$('#txt').value.trim(); if (!v) return; $('#txt').value=''; send(v); };
$('#clear').onclick = () => { interrupt(); killRec(); S.live=false; S.hist=[]; $('#log').innerHTML=EMPTY; setState('idle'); };
document.addEventListener('keydown', e => {
  if (e.code==='Space' && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName) && !$('#dlg').open) { e.preventDefault(); main(); }
});

/* ---------- Settings ---------- */
function loadVoices(){
  if (!synth) return;
  const vs = synth.getVoices(), sel = $('#voice'); sel.innerHTML = '';
  vs.forEach(v => sel.append(new Option(v.name+' ('+v.lang+')', v.name)));
  if (!vs.some(v => v.name===S.voice)) {
    const p = vs.find(v => /Daniel|UK English Male|Rishi|Google UK English/i.test(v.name)) || vs.find(v => v.lang.startsWith('en')) || vs[0];
    if (p) { S.voice = p.name; save(); }
  }
  sel.value = S.voice;
}
if (synth) { synth.onvoiceschanged = loadVoices; loadVoices(); }
$('#key').value = S.key; $('#model').value = S.model; $('#lang').value = S.lang; $('#name').value = S.name; $('#rate').value = S.rate;
$('#key').oninput   = e => { S.key = e.target.value.trim(); save(); };
$('#model').onchange= e => { S.model = e.target.value; save(); };
$('#lang').onchange = e => { S.lang = e.target.value; save(); };
$('#name').oninput  = e => { S.name = e.target.value.trim(); save(); };
$('#voice').onchange= e => { S.voice = e.target.value; save(); };
$('#rate').oninput  = e => { S.rate = +e.target.value; save(); };
$('#test').onclick  = () => { synth.cancel(); speak('All systems are online and ready when you are, ' + (S.name || 'sir') + '.'); };
$('#cfg').onclick   = () => $('#dlg').showModal();
$('#close').onclick = () => $('#dlg').close();
if (!S.key) $('#dlg').showModal();
</script>
</body>
</html>
